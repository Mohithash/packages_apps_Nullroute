org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Soong's aapt2 invocation does not generate BuildConfig, and Soong has no
# equivalent of a Gradle build type. Turning these off here (and in
# app/build.gradle.kts) makes the Gradle build fail on any source that reaches
# for something the shipping build cannot provide, instead of letting it through
# and failing four hours later inside `mka`.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official
